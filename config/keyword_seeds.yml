# Graines de la carte des mots-clés (scripts/keyword_map.py).
# Chaque graine est déclinée par les suggestions Google (graine seule, + a…z, + mots interrogatifs, + mois),
# puis les meilleures requêtes passent en SERP pour récupérer les « Autres questions » et juger la concurrence.
# Ajouter une graine ici puis relancer : suggestions gratuites, SERP en cache 14 jours.

graines:
  - voyage
  - escapade
  - week end
  - endroits les plus
  - quand visiter
  - quand partir
  - où partir
  - voyage en famille
  - voyage entre amis
  - road trip
  - vacances pas cher
  - destination
  - hors des sentiers battus

# Déclinaisons ajoutées à chaque graine (en plus de a…z).
declinaisons: [où, quand, comment, quel, quelle, combien, pas cher, en janvier, en février, en mars, en avril, en mai,
               en juin, en juillet, en août, en septembre, en octobre, en novembre, en décembre, en europe, en france]

