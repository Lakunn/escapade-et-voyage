# Second niveau : chaque destination repérée (« quand partir au Japon », « voyage Vietnam ») est déclinée ainsi.
declinaisons_destination: ["que faire {d}", "que voir {d}", "itinéraire {d}", "road trip {d}", "budget voyage {d}", "{d} hors des sentiers battus"]
destinations_max: 40

volume_min: 50   # utilisé seulement si des volumes sont disponibles (clé DataForSEO dans l'outil)
serp_max: 80     # SERP payées (SerpAPI gratuit : 250 par mois, partagées avec les autres sites)
