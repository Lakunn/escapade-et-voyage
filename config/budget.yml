# Données du calculateur de budget (/outils/budget-voyage/).
# scripts/budget_data.py combine ce fichier, le niveau des prix de chaque pays (Banque mondiale)
# et les budgets relevés dans nos articles, puis écrit theme/escapade/assets/budget-data.json.
#
# Tous les montants sont en euros, par adulte et par jour, hors billets pour rejoindre la destination.

# Point de départ : budgets journaliers en France, hypothèses de la rédaction, logement compté
# pour deux adultes par chambre. Ils sont ensuite ajustés au niveau des prix de chaque pays.
modele:
  petit:  { logement: 30,  repas: 22, transports: 7,  activites: 8,  divers: 5 }
  moyen:  { logement: 60,  repas: 40, transports: 12, activites: 20, divers: 10 }
  gros:   { logement: 140, repas: 80, transports: 30, activites: 45, divers: 25 }
  libelles:
    petit: "Auberges, chambres chez l'habitant, marchés et cantines, transports publics."
    moyen: "Hôtels simples ou maisons d'hôtes, restaurants de quartier, quelques visites guidées."
    gros: "Beaux hôtels, bonnes tables, chauffeurs ou location de voiture, activités privées."

# Sensibilité de chaque poste au niveau des prix du pays (1 = suit entièrement l'écart de prix).
# Les activités et le haut de gamme suivent moins : prix « touristes » et hôtellerie internationale.
elasticite:
  logement: 0.9
  repas: 1.0
  transports: 1.0
  activites: 0.75
  divers: 1.0
  gros_logement: 0.75

# Coefficients appliqués selon les choix du voyageur.
coefficients:
  saison:
    haute:   { logement: 1.30, activites: 1.05 }
    moyenne: {}
    basse:   { logement: 0.80, activites: 0.95 }
  style:
    battus: { logement: 1.10, repas: 1.10, activites: 1.25 }
    mixte:  {}
    hors:   { logement: 0.85, repas: 0.85, activites: 0.75, transports: 1.25 }
  # Un enfant de moins de 12 ans, en part d'un adulte.
  enfant: { logement: 0.35, repas: 0.6, transports: 0.5, activites: 0.5, divers: 0.5 }
  # Un adulte seul paie la chambre entière.
  solo_logement: 1.6

# Destinations proposées. Saisons : mois de haute et de basse saison touristique (repères généraux,
# à nuancer selon la région du pays). Les autres mois comptent en saison moyenne.
